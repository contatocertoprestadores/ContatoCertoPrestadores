 const criarPedido = async(e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  let foto = '';
  const ff = fd.get('foto');
  if(ff && ff.size > 0) foto = await toB64(ff);
  const novoLocal = {
   id: 'temp-'+Date.now(),
   nome: fd.get('nome'),
   endereco: fd.get('endereco'),
   whatsapp: fd.get('whatsapp'),
   cidade: fd.get('cidade'),
   bairro: fd.get('bairro'),
   categoria: fd.get('categoria'),
   descricao: fd.get('descricao'),
   foto: foto,
   data: new Date().toISOString(),
   status: 'aberto',
   desbloqueios: []
  };
  // Salvar imediatamente local + backup para não sumir ao atualizar
  const novosPedidos = [novoLocal, ...pedidos];
  setPedidos(novosPedidos);
  localStorage.setItem('cc_pedidos_backup', JSON.stringify(novosPedidos));
  
  // Tentar salvar no Supabase para ficar online para todos
  try{
   const {data, error} = await supa.from('pedidos').insert([{
    nome: novoLocal.nome,
    endereco: novoLocal.endereco,
    whatsapp: novoLocal.whatsapp,
    cidade: novoLocal.cidade,
    bairro: novoLocal.bairro,
    categoria: novoLocal.categoria,
    descricao: novoLocal.descricao,
    foto_url: novoLocal.foto,
    status: 'aberto',
    desbloqueio_por: []
   }]).select();
   
   if(error){
    console.log('Erro Supabase insert:', error);
    if(error.message.includes('RLS') || error.code==='42501'){
     toastM('⚠️ Pedido salvo LOCAL, mas NÃO está online para todos! Rode supabase-setup.sql no Supabase SQL Editor');
     setRealtimeStatus('⚠️ RLS bloqueado - Rode SQL');
    } else {
     toastM('⚠️ Erro: '+error.message+' - Mas salvo localmente, não some mais');
    }
   } else if(data && data[0]){
    // Sucesso Supabase - substituir temp por real
    const atualizados = [ {...novoLocal, id: data[0].id, data: data[0].created_at}, ...pedidos.filter(p=> !String(p.id).startsWith('temp-')) ];
    setPedidos(atualizados);
    localStorage.setItem('cc_pedidos_backup', JSON.stringify(atualizados));
    toastM('✅ Pedido AO VIVO para TODOS! CLIENTE NÃO PAGA NADA PARA ANUNCIAR');
    setRealtimeStatus('🟢 AO VIVO - pedido publicado');
   }
  }catch(err){ 
   console.log('Erro publicar', err);
   toastM('✅ Pedido salvo localmente! Para ficar online para todos, rode supabase-setup.sql'); 
  }
  setShowPedido(false);
 };

 const cadastrar = async(e)=>{
  e.preventDefault();
  try{
   const fd = new FormData(e.target);
   let foto = '';

   if(ff && ff.size > 0){
    try{
     const b64 = await toB64(ff);
     foto = b64.length > 100000 ? '' : b64;
    }catch(err){}
   }
   let bonus = 500;
   try{ const pend = localStorage.getItem('cc_bonus'); if(pend){ bonus += parseInt(pend); localStorage.removeItem('cc_bonus'); } }catch(err){}
   const novo = {
    id: 'temp-'+Date.now(),
    nome: fd.get('nome')||'',
    sobrenome: fd.get('sobrenome')||'',
    email: fd.get('email')||'',
    whatsapp: fd.get('whatsapp')||'',
    profissao: fd.get('profissao')||'',
    cidade: fd.get('cidade')||'',
    usuario: fd.get('usuario')||'',
    senha: fd.get('senha')||'',
    foto: foto,
    moedas: bonus,
    created_at: new Date().toISOString()
   };
   if(!novo.usuario){ toastM('Usuario obrigatorio'); return; }
   if(prest.find(p=>p.usuario===novo.usuario)){ toastM('Usuario ja existe'); return; }
   try{
    const {data} = await supa.from('prestadores').insert([{nome: novo.nome, sobrenome: novo.sobrenome, email: novo.email, whatsapp: novo.whatsapp, profissao: novo.profissao, cidade: novo.cidade, usuario: novo.usuario, senha: novo.senha, foto_url: '', moedas: novo.moedas}]).select();
    if(data && data[0]) novo.id = data[0].id;
   }catch(err){}
   setPrest(prev=>[...prev, novo]);
   try{ localStorage.setItem('cc_u', JSON.stringify({...novo, foto: ''})); }catch(err){}
   setUser(novo);
   setShowCad(false);
   setTimeout(()=>setShowPerfil(true), 100);
   setHist(prev=>[{id: Date.now().toString(), pid: novo.id, tipo: 'entrada', qtd: bonus, desc: 'Bonus cadastro', data: new Date().toISOString()}, ...prev]);
   toastM('Cadastro! +'+bonus+' moedas!');
  }catch(err){
   toastM('Erro cadastro: '+err.message);
   setShowCad(false);
  }
 };

 const login = (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = prest.find(p=> p.usuario===fd.get('usuario') && p.senha===fd.get('senha'));
  if(!f){ toastM('Usuário ou senha inválidos'); return; }
  setUser(f);
  setShowLogin(false);
  setShowPerfil(true);
  toastM('Bem-vindo '+f.nome);
 };

 const desbloquear = async(p)=>{
  if(!user){ setShowLogin(true); return; }
  if(p.desbloqueios.includes(user.id)){ toastM('Já desbloqueado - veja em Perfil > Desbloqueados'); return; }
  if(user.moedas < custo){ toastM('⚠️ Sem moedas! Compre mais'); setShowCompra(PLANOS[1]); return; }
  const novoSaldo = {...user, moedas: user.moedas - custo};
  setUser(novoSaldo);
  setPrest(prest.map(x=> x.id===user.id ? novoSaldo : x));
  const novosDesbloqueios = [...p.desbloqueios, user.id];
  setPedidos(pedidos.map(x=> x.id===p.id ? {...x, desbloqueios: novosDesbloqueios} : x));
  setHist([{id: Date.now().toString(), pid: user.id, tipo: 'uso', qtd: custo, desc: 'Desbloqueio '+p.categoria+' - '+p.nome+' '+p.cidade, data: new Date().toISOString()}, ...hist]);
  try{
   await supa.from('pedidos').update({desbloqueio_por: novosDesbloqueios}).eq('id', p.id);
   await supa.from('prestadores').update({moedas: novoSaldo.moedas}).eq('id', user.id);
  }catch(e){}
  if(novoSaldo.moedas <= 50){
   toastM('⚠️ Só '+novoSaldo.moedas+' moedas restantes! Compre agora');
   setTimeout(()=>setShowCompra(PLANOS[1]), 1200);
  } else {
   toastM('✅ Contato liberado!');
  }
 };

  setShowMenu(false);
 };

     <h3 className="text-white font-bold mb-1">💰 Compras e Comprovantes - PIX contatocerto.prestadores@gmail.com</h3>
     <p className="text-white/60 text-xs mb-4">Quando prestador envia comprovante, aparece aqui ao vivo. Aprove e libere moedas.</p>
     <div className="grid md:grid-cols-2 gap-3">
      {compras.length===0 ? <p className="text-white/50 text-sm col-span-2 bg-white/5 p-6 rounded-2xl text-center border border-white/10">Nenhuma compra ainda. Quando prestador enviar comprovante da galeria + WhatsApp, aparece aqui em tempo real.</p> :
       compras.filter(c=>JSON.stringify(c).toLowerCase().includes(buscaADM.toLowerCase())).map(c=>(
        <div key={c.id} className="bg-white rounded-2xl p-4 shadow">
         <div className="flex justify-between items-start"><div><p className="font-bold text-sm text-[#0A1931]">{c.usuario} - 🪙 {c.moedas} moedas - R$ {c.valor}</p><p className="text-xs text-gray-500">ID Prest: {String(c.prest_id).slice(0,8)} • {c.data ? new Date(c.data).toLocaleString() : ''}</p></div><span className={`text-[10px] px-2.5 py-1 rounded-full font-bold ${c.status==='liberado' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>{c.status}</span></div>
         {c.comp && <img src={c.comp} alt="Comprovante" className="w-full h-64 object-contain bg-gray-50 rounded-xl mt-3 border"/>}
         {!c.comp && <div className="w-full h-24 bg-gray-50 rounded-xl mt-3 flex items-center justify-center text-xs text-gray-400 border">Sem imagem - compra antiga ou erro upload</div>}
         <div className="flex gap-2 mt-3">
          <button onClick={()=>aprovarCompra(c)} className="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-full text-xs font-bold transition-colors">✅ Aprovar e Liberar {c.moedas} moedas</button>
          <button onClick={async()=>{ setCompras(compras.map(x=>String(x.id)===String(c.id) ? {...x, status:'recusado'} : x)); try{ await supa.from('compras').update({status:'recusado'}).eq('id', c.id); }catch(e){} toastM('Recusado'); }} className="px-4 py-3 rounded-full bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold transition-colors">Recusar</button>
         </div>
         <a href={`https://wa.me/5518991488302?text=Comprovante ${c.usuario} ${c.moedas} moedas R$${c.valor}`} target="_blank" className="block w-full mt-2 bg-[#0A1931] hover:bg-black text-white text-center py-2.5 rounded-full text-xs font-bold transition-colors">Abrir WhatsApp comprovante</a>
        </div>
       ))
      }
     </div>
    </div>}

    {abaADM==='financeiro' && <div>
     <div className="grid md:grid-cols-3 gap-3">
      <div className="bg-white rounded-2xl p-5 shadow"><p className="text-xs text-gray-500">Total vendido (aprovado)</p><p className="text-3xl font-bold text-green-600">R$ {compras.filter(c=>c.status==='liberado').reduce((s,c)=>s+Number(c.valor||0),0).toFixed(2)}</p><p className="text-[11px] text-gray-400">{compras.filter(c=>c.status==='liberado').length} vendas aprovadas</p></div>
      <div className="bg-white rounded-2xl p-5 shadow"><p className="text-xs text-gray-500">Total bruto (todos)</p><p className="text-3xl font-bold text-[#0A1931]">R$ {compras.reduce((s,c)=>s+Number(c.valor||0),0).toFixed(2)}</p><p className="text-[11px] text-gray-400">{compras.length} vendas total (pendentes + aprovadas)</p></div>
      <div className="bg-yellow-400 rounded-2xl p-5 shadow"><p className="text-xs text-[#0A1931]/70">Moedas em circulação</p><p className="text-3xl font-bold text-[#0A1931]">{prest.reduce((s,p)=>s+(p.moedas||0),0)} 🪙</p><p className="text-[11px] text-[#0A1931]/70">Soma saldos todos prestadores</p></div>
     </div>
     <div className="mt-6 bg-white rounded-2xl p-4 shadow"><p className="font-bold text-sm text-[#0A1931]">📊 Vendas por plano (tempo real)</p>{PLANOS.map(pl=>{ const q = compras.filter(c=>c.moedas===pl.m).length; const tot = compras.filter(c=>c.moedas===pl.m).reduce((s,c)=>s+Number(c.valor||0),0); return <div key={pl.m} className="flex justify-between text-sm py-3 border-b last:border-0"><span>🪙 {pl.m} moedas - R$ {pl.v}</span><span className="font-bold">{q} vendas - R$ {tot.toFixed(2)}</span></div>; })}</div>
     <div className="mt-4 bg-white rounded-2xl p-4 shadow"><p className="font-bold text-sm text-[#0A1931]">📈 Histórico geral moedas (tempo real)</p><div className="max-h-96 overflow-y-auto">{hist.slice(0,100).map(h=><div key={h.id} className="flex justify-between text-xs py-2 border-b last:border-0"><span className="truncate pr-2">{new Date(h.data).toLocaleDateString()} {new Date(h.data).toLocaleTimeString()} - {h.desc} - {h.pid ? String(h.pid).slice(0,6) : ''}</span><span className={`font-bold flex-shrink-0 ${h.tipo==='uso' ? 'text-red-500' : 'text-green-600'}`}>{h.tipo==='uso' ? '-' : '+'}{h.qtd}</span></div>)}</div></div>
    </div>}

    {abaADM==='config' && <div>
     <div className="bg-white rounded-2xl p-6 shadow">
      <p className="font-bold text-[#0A1931]">⚙️ Configurações Sistema - Tempo Real</p>
      <div className="mt-4"><label className="text-xs font-bold text-[#0A1931]">💰 Custo para desbloquear contato (moedas) - Vale para todos ao vivo</label><div className="flex gap-2 mt-2"><input type="number" value={custo} onChange={e=>setCusto(Number(e.target.value))} className="flex-1 border rounded-xl px-4 py-3 text-sm focus:border-yellow-400 focus:outline-none"/><button onClick={()=>toastM(`✅ Custo atualizado para ${custo} moedas para todos!`)} className="bg-yellow-400 hover:opacity-90 px-6 py-3 rounded-full font-bold text-sm text-[#0A1931] transition-opacity">Salvar</button></div><p className="text-[11px] text-gray-500 mt-2">Atual: {custo} moedas por desbloqueio. Recomendado: 30-70. Salvo no localStorage e vale para todos que recarregarem.</p></div>
      <div className="mt-6 p-4 bg-[#0A1931] rounded-2xl text-white shadow"><p className="text-xs font-bold text-yellow-400">🔐 Informações Sistema</p><p className="text-[11px] mt-2">Senha ADM: 20112024 • Acesso: 5 toques na logo</p><p className="text-[11px]">PIX: contatocerto.prestadores@gmail.com • WhatsApp: (18) 99148-8302</p><p className="text-[11px] mt-1">Supabase: rxteebstgzogpkhaxjxz.supabase.co • Projeto: Contato Certo</p><p className="text-[11px]">Site Vercel: https://contatocerto-prestadores.vercel.app</p><p className="text-[11px] mt-2">Status Realtime: {realtimeStatus}</p><p className="text-[11px]">Para funcionar para todos: rode supabase-setup.sql no SQL Editor do Supabase</p></div>
      <div className="mt-6"><p className="text-xs font-bold text-[#0A1931]">🗑️ Ações perigosas - Cuidado</p><div className="flex flex-wrap gap-2 mt-2"><button onClick={()=>{ if(confirm('Limpar TODOS pedidos localmente? Não apaga do Supabase.')){ setPedidos([]); toastM('Pedidos limpos local'); } }} className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-full text-xs font-bold transition-colors">Limpar pedidos local</button><button onClick={()=>{ if(confirm('Resetar moedas de TODOS prestadores para 500?')){ setPrest(prest.map(p=>({...p, moedas:500}))); toastM('Moedas resetadas para 500 para todos local'); } }} className="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-full text-xs font-bold transition-colors">Resetar moedas 500 (local)</button><button onClick={()=>{ if(confirm('Limpar histórico moedas local?')){ setHist([]); toastM('Histórico limpo'); } }} className="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-full text-xs font-bold transition-colors">Limpar histórico</button></div></div>
     </div>
    </div>}
   </div>
  </div></div>}

   {toast && <div className="fixed bottom-28 left-1/2 -translate-x-1/2 bg-[#0A1931] text-white px-6 py-3 rounded-full shadow-2xl text-sm font-bold z-[100] text-center max-w-[90%] border border-yellow-500/20">{toast}</div>}
  </div>
 )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
