   <main className="max-w-6xl mx-auto px-4">

     <div className="mt-4 flex gap-2 overflow-x-auto">
      {['Todos',...CATS].map(c=><button key={c} onClick={()=>setFiltro(c)} className={`px-4 py-2 rounded-full text-xs font-bold border whitespace-nowrap ${filtro===c?'bg-yellow-400 text-[#0A1931]':'bg-white/10 text-white/70'}`}>{c}</button>)}

    <h3 className="font-bold mt-6">📋 Pedidos ao vivo ({filtrados.length}) • Tempo real</h3>
    <div className="grid md:grid-cols-2 gap-4 mt-3">
     {filtrados.map(p=>{
      const d=user&&p.desbloqueios.includes(user.id);

        {p.foto&&<img src={p.foto} className="w-full h-36 object-cover"/>}

         <p className="font-bold mt-2">{p.cidade} • {p.bairro}</p>

         {d?<a href={`https://wa.me/55${p.whatsapp}`} target="_blank" className="block w-full mt-3 bg-green-600 text-white text-center py-3 rounded-full font-bold text-sm">WhatsApp Cliente</a>:<button onClick={()=>desbloquear(p)} className="w-full mt-3 bg-gradient-to-r from-yellow-400 to-yellow-500 py-3 rounded-full font-extrabold text-sm text-[#0A1931]">🔓 Desbloquear • {custo} 🪙</button>}

       </div>
      )

    </div>

    <div className="mt-8 bg-white rounded-[24px] p-6 border"><h3 className="font-bold">💰 Comprar Moedas - PIX: contatocerto.prestadores@gmail.com</h3><div className="grid md:grid-cols-3 gap-3 mt-4">{PLANOS.map(pl=><div key={pl.m} className="border-2 rounded-2xl p-4"><p className="font-extrabold text-xl">🪙 {pl.m}</p><p className="font-bold">R$ {pl.v}</p><button onClick={()=>{if(!user){setShowLogin(true); return} setShowCompra(pl)}} className="w-full mt-2 bg-[#0A1931] text-white py-2 rounded-full text-sm font-bold">Comprar PIX</button></div>)}</div></div>
   </main>

   <nav className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-30">

    <button onClick={()=>setShowPerfil(true)} className="flex flex-col items-center text-[11px]"><span className="text-xl">👤</span>Perfil</button>
   </nav>

   {showMenu&&<div className="fixed inset-0 z-[70] bg-black/60" onClick={()=>setShowMenu(false)}><div onClick={e=>e.stopPropagation()} className="absolute right-0 top-0 h-full w-[85%] max-w-[340px] bg-white shadow-2xl p-6 overflow-y-auto">
    <div className="flex justify-between"><div className="flex items-center gap-2"><img src={LOGO} className="w-8 h-8 rounded-xl"/><p className="font-bold text-sm">CONTATO CERTO</p></div><button onClick={()=>setShowMenu(false)} className="w-8 h-8 rounded-full bg-gray-100">✕</button></div>

     <a href="https://wa.me/5518991488302" target="_blank" className="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50 block">💬 Suporte 24h</a>

    {user&&<div className="mt-4 p-4 bg-yellow-50 rounded-2xl border"><p className="text-xs">Suas moedas</p><p className="font-bold text-xl">🪙 {user.moedas}</p>{user.moedas<=50&&<p className="text-[11px] text-red-600 font-bold">⚠️ Acabando!</p>}</div>}

   {showPedido&&<div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center"><form onSubmit={criarPedido} className="bg-white w-full max-w-lg rounded-t-[28px] sm:rounded-[28px] p-6 max-h-[90vh] overflow-y-auto"><div className="flex justify-between"><h3 className="font-bold text-xl">Pedir Orçamento</h3><button type="button" onClick={()=>setShowPedido(false)}>✕</button></div><p className="text-[11px] text-green-600 font-bold mt-1">✅ CLIENTE NÃO PAGA NADA PARA ANUNCIAR</p><div className="grid gap-3 mt-4"><select name="categoria" required className="border rounded-xl px-4 py-3 text-sm">{CATS.map(c=><option key={c}>{c}</option>)}</select><input name="nome" required placeholder="Nome" className="border rounded-xl px-4 py-3 text-sm"/><input name="endereco" required placeholder="Endereço (oculto)" className="border rounded-xl px-4 py-3 text-sm"/><input name="whatsapp" required placeholder="WhatsApp" className="border rounded-xl px-4 py-3 text-sm"/><div className="grid grid-cols-2 gap-3"><input name="cidade" required placeholder="Cidade" className="border rounded-xl px-4 py-3 text-sm"/><input name="bairro" required placeholder="Bairro" className="border rounded-xl px-4 py-3 text-sm"/></div><textarea name="descricao" required placeholder="Descrição" rows="3" className="border rounded-xl px-4 py-3 text-sm"></textarea><input type="file" name="foto" accept="image/*" className="border rounded-xl px-4 py-3 text-sm"/><button className="w-full bg-gradient-to-r from-yellow-400 to-yellow-500 py-4 rounded-full font-extrabold text-[#0A1931]">Publicar Grátis - CLIENTE NÃO PAGA NADA PARA ANUNCIAR</button></div></form></div>}

   {showCad&&<div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center"><form onSubmit={cadastrar} className="bg-white w-full max-w-lg rounded-t-[28px] p-6 max-h-[90vh] overflow-y-auto"><h3 className="font-bold text-xl">Cadastro Prestador - 500 moedas grátis</h3><p className="text-xs text-green-600 font-bold">+500 moedas ao baixar app = 1000 total!</p><div className="grid gap-3 mt-4"><input type="file" name="foto" accept="image/*" className="border rounded-xl px-4 py-2 text-sm"/><div className="grid grid-cols-2 gap-3"><input name="nome" required placeholder="Nome" className="border rounded-xl px-4 py-3 text-sm"/><input name="sobrenome" required placeholder="Sobrenome" className="border rounded-xl px-4 py-3 text-sm"/></div><input name="email" type="email" required placeholder="Email" className="border rounded-xl px-4 py-3 text-sm"/><input name="whatsapp" required placeholder="WhatsApp" className="border rounded-xl px-4 py-3 text-sm"/><select name="profissao" required className="border rounded-xl px-4 py-3 text-sm">{CATS.map(c=><option key={c}>{c}</option>)}</select><input name="cidade" required placeholder="Cidade" className="border rounded-xl px-4 py-3 text-sm"/><input name="usuario" required placeholder="Usuário" className="border rounded-xl px-4 py-3 text-sm"/><input name="senha" type="password" required placeholder="Senha" className="border rounded-xl px-4 py-3 text-sm"/><button className="w-full bg-[#0A1931] text-white py-4 rounded-full font-bold">Cadastrar +500 moedas GRÁTIS</button><button type="button" onClick={()=>setShowCad(false)} className="text-xs">Fechar</button></div></form></div>}

   {showLogin&&<div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"><form onSubmit={login} className="bg-white w-full max-w-sm rounded-[24px] p-6"><h3 className="font-bold text-xl">Login - Prestador</h3><div className="grid gap-3 mt-4"><input name="usuario" required placeholder="Usuário" className="border rounded-xl px-4 py-3 text-sm"/><input name="senha" type="password" required placeholder="Senha" className="border rounded-xl px-4 py-3 text-sm"/><button className="w-full bg-gradient-to-r from-yellow-400 to-yellow-500 py-3 rounded-full font-bold text-[#0A1931]">Entrar</button><button type="button" onClick={()=>{setShowLogin(false); setShowCad(true)}} className="text-xs text-center">Sem conta? Cadastre-se +500 moedas grátis</button></div></form></div>}

   {showPerfil&&<div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center"><div className="bg-gray-50 w-full max-w-lg rounded-t-[28px] p-6 max-h-[90vh] overflow-y-auto"><div className="flex justify-between"><div className="flex gap-3"><div className="w-12 h-12 rounded-xl bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center overflow-hidden">{user?.foto?<img src={user.foto} className="w-full h-full object-cover"/>:<span className="font-bold">{user?user.nome[0]:'?'}</span>}</div><div>{user?<><p className="font-bold">{user.nome}</p><p className="text-xs">🪙 {user.moedas} • {user.profissao}</p></>:<p>Visitante - Faça cadastro +500 moedas grátis</p>}</div></div><button onClick={()=>setShowPerfil(false)}>✕</button></div><div className="mt-4">{!user?<div className="text-center py-10"><p className="text-sm">Cadastro obrigatório para prestadores</p><p className="text-xs text-green-600 font-bold">+500 moedas grátis ao cadastrar +500 ao baixar app</p><button onClick={()=>{setShowPerfil(false); setShowLogin(true)}} className="bg-[#0A1931] text-white px-6 py-3 rounded-full font-bold mt-4">Login</button><button onClick={()=>{setShowPerfil(false); setShowCad(true)}} className="bg-yellow-400 px-6 py-3 rounded-full font-bold ml-2">Cadastro +500</button></div>:<div><p className="font-bold text-sm">Desbloqueados:</p>{pedidos.filter(p=>p.desbloqueios.includes(user.id)).map(p=><div key={p.id} className="bg-white p-3 rounded-xl mt-2 text-xs"><p className="font-bold">{p.nome} - {p.categoria}</p><p>📱 {p.whatsapp} 📍 {p.endereco}</p><a href={`https://wa.me/55${p.whatsapp}`} target="_blank" className="inline-block mt-1 bg-green-600 text-white px-3 py-1 rounded-full">WhatsApp</a></div>)}<div className="mt-4"><p className="font-bold text-sm">Comprar moedas:</p><div className="grid grid-cols-3 gap-2 mt-2">{PLANOS.map(pl=><div key={pl.m} className="bg-white p-3 rounded-xl border text-center"><p className="font-bold">{pl.m} 🪙</p><p className="text-xs">R$ {pl.v}</p><button onClick={()=>setShowCompra(pl)} className="w-full mt-1 bg-[#0A1931] text-white text-[10px] py-1 rounded-full">Comprar</button></div>)}</div></div><button onClick={()=>{localStorage.removeItem('cc_u'); setUser(null); setShowPerfil(false)}} className="w-full mt-6 bg-red-50 text-red-600 py-3 rounded-full font-bold text-sm">Sair</button></div>}</div></div></div>}

   {showCompra&&<div className="fixed inset-0 z-[60] bg-black/70 flex items-end sm:items-center justify-center"><form onSubmit={e=>{e.preventDefault(); const c={id:Date.now().toString(),prest_id:user.id,usuario:user.usuario,moedas:showCompra.m,valor:showCompra.v,status:'enviado'}; setCompras([c,...compras]); window.open(`https://wa.me/5518991488302?text=${encodeURIComponent(`Comprovante ${showCompra.m} moedas ${user.usuario}`)}`,'_blank'); setShowCompra(null); toastM('Enviado! Aguarde ADM liberar');}} className="bg-white w-full max-w-md rounded-t-[28px] p-6"><h3 className="font-bold">PIX {showCompra.m} moedas - R$ {showCompra.v}</h3><div className="bg-amber-50 border rounded-2xl p-4 mt-4"><p className="text-xs font-bold">PIX: contatocerto.prestadores@gmail.com</p><button type="button" onClick={()=>navigator.clipboard.writeText('contatocerto.prestadores@gmail.com')} className="mt-2 bg-[#0A1931] text-white text-[10px] px-3 py-1 rounded-full">Copiar PIX</button></div><input required type="file" name="comprovante" accept="image/*" className="w-full mt-4 border-2 border-dashed rounded-2xl p-4 text-sm"/><button className="w-full mt-4 bg-gradient-to-r from-yellow-400 to-yellow-500 py-4 rounded-full font-extrabold text-[#0A1931]">📤 Enviar Comprovante + WhatsApp</button>{user&&user.moedas<=50&&<p className="text-[11px] text-red-600 font-bold mt-2 text-center">⚠️ Suas moedas estão acabando! Só {user.moedas} restantes</p>}</form></div>}

   {showADMLogin&&<div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4"><div className="bg-white rounded-[24px] p-6 w-full max-w-sm"><h3 className="font-bold">🔐 ADM</h3><input id="admS" type="password" placeholder="Senha" className="w-full mt-4 border rounded-xl px-4 py-3"/><div className="flex gap-2 mt-4"><button onClick={()=>setShowADMLogin(false)} className="flex-1 bg-gray-100 py-3 rounded-full">Cancelar</button><button onClick={()=>{const s=document.getElementById('admS').value; if(s==='20112024'){setShowADM(true); setShowADMLogin(false)}else{toastM('Senha errada')}}} className="flex-1 bg-[#0A1931] text-white py-3 rounded-full font-bold">Entrar</button></div></div></div>}

   {showADM&&<div className="fixed inset-0 z-[80] bg-[#060F1F] overflow-y-auto p-4"><div className="max-w-3xl mx-auto"><div className="flex justify-between text-white"><h2 className="font-bold text-xl">PAINEL ADM - Ao vivo</h2><button onClick={()=>setShowADM(false)} className="w-8 h-8 rounded-full bg-white/10">✕</button></div><div className="grid grid-cols-2 gap-3 mt-6"><div className="bg-white/10 rounded-2xl p-4 text-white"><p className="text-xs">Prestadores</p><p className="text-2xl font-bold">{prest.length}</p></div><div className="bg-white/10 rounded-2xl p-4 text-white"><p className="text-xs">Pedidos</p><p className="text-2xl font-bold">{pedidos.length}</p></div></div><h3 className="text-white font-bold mt-6">Compras</h3>{compras.map(c=><div key={c.id} className="bg-white rounded-2xl p-4 mt-2 flex justify-between"><div><p className="font-bold text-sm">{c.usuario} {c.moedas} moedas</p><p className="text-xs">{c.status}</p></div><button onClick={()=>{const pr=prest.find(p=>p.id===c.prest_id); if(pr){const nu={...pr,moedas:pr.moedas+c.moedas}; setPrest(prest.map(x=>x.id===pr.id?nu:x)); if(user&&user.id===pr.id) setUser(nu)} setCompras(compras.map(x=>x.id===c.id?{...x,status:'liberado'}:x)); toastM('Liberado!')}} className="bg-green-600 text-white px-4 py-2 rounded-full text-xs font-bold">Aprovar</button></div>)}<h3 className="text-white font-bold mt-6">Prestadores</h3>{prest.map(p=><div key={p.id} className="bg-white rounded-xl p-3 mt-2 flex justify-between"><p className="text-sm font-bold">{p.usuario} 🪙 {p.moedas}</p><button onClick={()=>{const q=prompt('Add moedas','100'); if(q){const nu={...p,moedas:p.moedas+Number(q)}; setPrest(prest.map(x=>x.id===p.id?nu:x)); if(user&&user.id===p.id) setUser(nu)}}} className="bg-[#0A1931] text-white text-xs px-3 py-1 rounded-full">+ moedas</button></div>)}</div></div>}

   {toast&&<div className="fixed bottom-28 left-1/2 -translate-x-1/2 bg-[#0A1931] text-white px-6 py-3 rounded-full shadow-xl text-sm font-bold z-[100]">{toast}</div>}
  </div>
 )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
