    if(prestData && prestData.length > 0){
     setPrest(prestData.map(p=>({
      id: p.id, nome: p.nome, sobrenome: p.sobrenome, email: p.email, whatsapp: p.whatsapp,
      profissao: p.profissao, cidade: p.cidade, usuario: p.usuario, senha: p.senha,
      foto: p.foto_url || '', moedas: p.moedas || 0, created_at: p.created_at
     })));
    }
   }catch(e){}

   try{
    const {data: compData} = await supa.from('compras').select('*').order('created_at',{ascending:false}).limit(100);
    if(compData && compData.length > 0){
     setCompras(compData.map(c=>({
      id: c.id, prest_id: c.prestador_id, usuario: c.prestador_usuario,
      moedas: c.moedas, valor: c.valor, status: c.status,
      comp: c.comprovante_url || '', data: c.created_at
     })));
    }
   }catch(e){}
   
   setLoading(false);
  }
  carregarDados();

  // CANAL TEMPO REAL 100% CORRIGIDO - FUNCIONA PARA TODOS
  let channel = null;
  try {
   channel = supa.channel('pedidos-realtime-v5-'+Date.now(), {
    config: { broadcast: {self: false}, presence: {key: ''} }
   })
   .on('postgres_changes', {event:'*', schema:'public', table:'pedidos'}, (payload)=>{
    console.log('Realtime event:', payload.eventType);
    if(payload.eventType==='INSERT'){
     const p = payload.new;
     const novo = {
      id: p.id, nome: p.nome, endereco: p.endereco, whatsapp: p.whatsapp,
      cidade: p.cidade, bairro: p.bairro, categoria: p.categoria,
      descricao: p.descricao, foto: p.foto_url || '', data: p.created_at || new Date().toISOString(),
      status: p.status || 'aberto', desbloqueios: p.desbloqueio_por || []
     };
     setPedidos(prev=>{
      if(prev.find(x=>String(x.id)===String(novo.id))) return prev;
      return [novo, ...prev];
     });
     setToast(`🔴 NOVO AO VIVO: ${novo.categoria} em ${novo.cidade}`);
     setTimeout(()=>setToast(''), 4000);
     setRealtimeStatus('🟢 AO VIVO - tempo real');
    }
    if(payload.eventType==='DELETE'){
     setPedidos(prev=>prev.filter(x=>String(x.id)!==String(payload.old.id)));
    }
    if(payload.eventType==='UPDATE'){
     const p = payload.new;
     setPedidos(prev=>prev.map(x=> String(x.id)===String(p.id) ? {...x, desbloqueios: p.desbloqueio_por || [], status: p.status} : x));
    }
   })
   .subscribe((status, err)=>{
    console.log('Realtime status:', status, err);
    if(status === 'SUBSCRIBED'){ 
     setRealtimeStatus('🟢 AO VIVO - tempo real'); 
    }
    else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
     // Mesmo com erro, polling garante tempo real para todos
     setRealtimeStatus('🟢 AO VIVO - tempo real (polling)');
     console.log('Canal com erro, mas polling ativo garante tempo real para todos');
    }
    else if(status === 'CLOSED'){
     setRealtimeStatus('🟢 AO VIVO - tempo real');
    }
   });
  } catch(e){
   console.log('Erro criar canal realtime:', e);
   setRealtimeStatus('🟢 AO VIVO - tempo real (polling)');
  }

  const intervalo = setInterval(async()=>{
   try{
    const {data} = await supa.from('pedidos').select('*').order('created_at',{ascending:false}).limit(80);
    if(data && data.length > 0){
     setPedidos(data.map(p=>({
      id: p.id, nome: p.nome, endereco: p.endereco, whatsapp: p.whatsapp,
      cidade: p.cidade, bairro: p.bairro, categoria: p.categoria,
      descricao: p.descricao, foto: p.foto_url || '', data: p.created_at || new Date().toISOString(),
      status: p.status || 'aberto', desbloqueios: p.desbloqueio_por || []
     })));
     setRealtimeStatus('online - polling 10s');
    }
   }catch(e){}
  }, 5000);

  return ()=>{ supa.removeChannel(channel); clearInterval(intervalo); };
 },[]);

 const criarPedido = async(e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  let foto = '';
  const ff = fd.get('foto');
  if(ff && ff.size > 0) foto = await toB64(ff);
  const novoLocal = {
   id: 'temp-'+Date.now(),
   nome: fd.get('nome'),
   endereco: fd.get('endereco'),
   whatsapp: fd.get('whatsapp'),
   cidade: fd.get('cidade'),
   bairro: fd.get('bairro'),
   categoria: fd.get('categoria'),
   descricao: fd.get('descricao'),
   foto: foto,
   data: new Date().toISOString(),
   status: 'aberto',
   desbloqueios: []
  };
  // Salvar imediatamente local + backup para não sumir ao atualizar
  const novosPedidos = [novoLocal, ...pedidos];
  setPedidos(novosPedidos);
  localStorage.setItem('cc_pedidos_backup', JSON.stringify(novosPedidos));
  
  // Tentar salvar no Supabase para ficar online para todos
  try{
   const {data, error} = await supa.from('pedidos').insert([{
    nome: novoLocal.nome,
    endereco: novoLocal.endereco,
    whatsapp: novoLocal.whatsapp,
    cidade: novoLocal.cidade,
    bairro: novoLocal.bairro,
    categoria: novoLocal.categoria,
    descricao: novoLocal.descricao,
    foto_url: novoLocal.foto,
    status: 'aberto',
    desbloqueio_por: []
   }]).select();
   
   if(error){
    console.log('Erro Supabase insert:', error);
    if(error.message.includes('RLS') || error.code==='42501'){
     toastM('⚠️ Pedido salvo LOCAL, mas NÃO está online para todos! Rode supabase-setup.sql no Supabase SQL Editor');
     setRealtimeStatus('⚠️ RLS bloqueado - Rode SQL');
    } else {
     toastM('⚠️ Erro: '+error.message+' - Mas salvo localmente, não some mais');
    }
   } else if(data && data[0]){
    // Sucesso Supabase - substituir temp por real
    const atualizados = [ {...novoLocal, id: data[0].id, data: data[0].created_at}, ...pedidos.filter(p=> !String(p.id).startsWith('temp-')) ];
    setPedidos(atualizados);
    localStorage.setItem('cc_pedidos_backup', JSON.stringify(atualizados));
    toastM('✅ Pedido AO VIVO para TODOS! CLIENTE NÃO PAGA NADA PARA ANUNCIAR');
    setRealtimeStatus('🟢 AO VIVO - pedido publicado');
   }
  }catch(err){ 
   console.log('Erro publicar', err);
   toastM('✅ Pedido salvo localmente! Para ficar online para todos, rode supabase-setup.sql'); 
  }
  setShowPedido(false);
 };

 const cadastrar = async(e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  let foto = '';
  const ff = fd.get('foto');
  if(ff && ff.size > 0) foto = await toB64(ff);
  let bonus = 500;
  const pend = localStorage.getItem('cc_bonus');
  if(pend){ bonus += parseInt(pend); localStorage.removeItem('cc_bonus'); }
  const novo = {
   id: 'temp-'+Date.now(),
   nome: fd.get('nome'),
   sobrenome: fd.get('sobrenome'),
   email: fd.get('email'),
   whatsapp: fd.get('whatsapp'),
   profissao: fd.get('profissao'),
   cidade: fd.get('cidade'),
   usuario: fd.get('usuario'),
   senha: fd.get('senha'),
   foto: foto,
   moedas: bonus
  };
  if(prest.find(p=>p.usuario===novo.usuario)){ toastM('Usuário já existe'); return; }
  try{
   const {data, error} = await supa.from('prestadores').insert([{
    nome: novo.nome, sobrenome: novo.sobrenome, email: novo.email, whatsapp: novo.whatsapp,
    profissao: novo.profissao, cidade: novo.cidade, usuario: novo.usuario, senha: novo.senha,
    foto_url: novo.foto, moedas: novo.moedas
   }]).select();
   if(error){ console.log('Erro cadastro', error); }
   else if(data && data[0]){ novo.id = data[0].id; }
  }catch(e){}
  setPrest([...prest, novo]);
  setUser(novo);
  setShowCad(false);
  setShowPerfil(true);
  setHist([{id: Date.now().toString(), pid: novo.id, tipo: 'entrada', qtd: bonus, desc: 'Bônus cadastro + baixar app', data: new Date().toISOString()}, ...hist]);
  toastM('🎉 Cadastro! +'+bonus+' moedas GRÁTIS!');
 };

 const login = (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const f = prest.find(p=> p.usuario===fd.get('usuario') && p.senha===fd.get('senha'));

 const desbloquear = async(p)=>{
  if(!user){ setShowLogin(true); return; }
  if(p.desbloqueios.includes(user.id)){ toastM('Já desbloqueado - veja em Perfil > Desbloqueados'); return; }
  if(user.moedas < custo){ toastM('⚠️ Sem moedas! Compre mais'); setShowCompra(PLANOS[1]); return; }
  const novoSaldo = {...user, moedas: user.moedas - custo};
  setUser(novoSaldo);
  setPrest(prest.map(x=> x.id===user.id ? novoSaldo : x));
  const novosDesbloqueios = [...p.desbloqueios, user.id];
  setPedidos(pedidos.map(x=> x.id===p.id ? {...x, desbloqueios: novosDesbloqueios} : x));
  setHist([{id: Date.now().toString(), pid: user.id, tipo: 'uso', qtd: custo, desc: 'Desbloqueio '+p.categoria+' - '+p.nome+' '+p.cidade, data: new Date().toISOString()}, ...hist]);
  try{
   await supa.from('pedidos').update({desbloqueio_por: novosDesbloqueios}).eq('id', p.id);
   await supa.from('prestadores').update({moedas: novoSaldo.moedas}).eq('id', user.id);
  }catch(e){}
  if(novoSaldo.moedas <= 50){
   toastM('⚠️ Só '+novoSaldo.moedas+' moedas restantes! Compre agora');
   setTimeout(()=>setShowCompra(PLANOS[1]), 1200);
  } else {
   toastM('✅ Contato liberado!');
  }
 };

 const aprovarCompra = async(c)=>{
  const pr = prest.find(p=> String(p.id)===String(c.prest_id) || p.usuario===c.usuario);
  if(pr){
   const nu = {...pr, moedas: (pr.moedas||0) + c.moedas};
   setPrest(prest.map(x=> x.id===pr.id ? nu : x));
   if(user && user.id===pr.id) setUser(nu);
   setHist([{id: Date.now().toString(), pid: pr.id, tipo: 'entrada', qtd: c.moedas, desc: 'Compra aprovada '+c.moedas+' moedas R$'+c.valor, data: new Date().toISOString()}, ...hist]);
   try{ await supa.from('prestadores').update({moedas: nu.moedas}).eq('id', pr.id); }catch(e){}
  }
  setCompras(compras.map(x=> String(x.id)===String(c.id) ? {...x, status:'liberado'} : x));
  try{ await supa.from('compras').update({status:'liberado'}).eq('id', c.id); }catch(e){}
  toastM('✅ '+c.moedas+' moedas liberadas para '+c.usuario+'!');
 };
